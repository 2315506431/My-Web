            // 类别与物品的对应关系
            const CATEGORY_ITEMS = {
                "本草方剂": ["异构抗凝膏", "醒心促愈素"],
                "节礼贺幛": ["镇厄面", "云门叠"],

                "素裳岳履": ["静笃护腕"],
                "器引百味": ["松烟釜"],
                "游方巧器": ["相位桩"]
            };
            
            // 元素引用
            const updateIndicator = document.getElementById('updateIndicator');
            const countdownElement = document.getElementById('countdownTimer');
            const errorMessage = document.getElementById('errorMessage');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const manualRefreshBtn = document.getElementById('manualRefresh');
            let countdownTimer = null;
            let isTrendSwitched = false;
            let originalData = null;
            let loadingTimeout = null;
            
            // 显示/隐藏加载遮罩
            function showLoading() {
                loadingOverlay.classList.add('active');
                
                // 设置最大加载时间，超时后强制隐藏加载状态
                clearTimeout(loadingTimeout);
                loadingTimeout = setTimeout(() => {
                    hideLoading();
                    showError('加载超时，请点击刷新按钮重试');
                }, MAX_LOADING_TIME);
            }
            
            function hideLoading() {
                loadingOverlay.classList.remove('active');
                clearTimeout(loadingTimeout);
            }
            
            // 显示更新提示
            function showUpdateIndicator() {
                updateIndicator.classList.add('show');
                setTimeout(() => updateIndicator.classList.remove('show'), 5000);
            }
            
            // 显示错误信息
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.classList.remove('hidden');
                
                // 5秒后自动隐藏非关键错误
                if (!message.includes('超时') && !message.includes('失败')) {
                    setTimeout(() => {
                        errorMessage.classList.add('hidden');
                    }, 5000);
                }
            }
            
            // 重置为加载中状态
            function resetToLoadingState() {
                isTrendSwitched = false;
                originalData = null;
                
                // 重置所有趋势项
                ['current1', 'current2', 'next1', 'next2'].forEach(id => {
                    const container = document.querySelector(`[data-id="${id}"]`);
                    if (container) {
                        container.innerHTML = '<i class="fa fa-spinner fa-spin text-2xl sm:text-3xl text-white/80"></i>';
                    }
                    
                    const textEl = document.querySelector(`p[data-id="${id}-text"]`);
                    if (textEl) {
                        textEl.textContent = '加载中...';
                    }
                    
                    // 重置角落图标
                    if (id.startsWith('current')) {
                        const placeholder = document.querySelector(`.corner-placeholder[data-for="${id}"]`);
                        if (placeholder) {
                            placeholder.innerHTML = '<i class="fa fa-spinner fa-spin text-gray-500"></i>';
                        }
                    }
                });
                
                // 重置推荐项
                ['currentRec', 'nextRec'].forEach(prefix => {
                    for (let i = 1; i <= 4; i++) {
                        const id = `${prefix}${i}`;
                        const placeholder = document.querySelector(`.recommend-placeholder[data-id="${id}"]`);
                        if (placeholder) {
                            placeholder.innerHTML = '<i class="fa fa-spinner fa-spin text-3xl"></i>';
                        }
                        
                        const textEl = document.querySelector(`p[data-id="${id}-text"]`);
                        if (textEl) {
                            textEl.textContent = '加载中...';
                        }
                        
                        const valueEl = document.querySelector(`span[data-id="${id}-value"]`);
                        if (valueEl) {
                            valueEl.textContent = '';
                            valueEl.classList.remove('highlight');
                        }
                    }
                });
                
                countdownElement.innerHTML = '<i class="fa fa-clock-o mr-1"></i>刷新时间：计算中...';
                errorMessage.classList.add('hidden');
            }
            
            // 创建角落图片
            function createCornerImage(targetId) {
                const img = document.createElement('img');
                img.src = FIXED_CORNER_IMAGE;
                img.className = 'corner-image';
                img.alt = `${targetId}热门标识`;
                
                const placeholder = document.querySelector(`.corner-placeholder[data-for="${targetId}"]`);
                if (placeholder) placeholder.remove();
                
                img.onerror = () => {
                    const errorIcon = document.createElement('div');
                    errorIcon.className = 'corner-image flex items-center justify-center';
                    errorIcon.innerHTML = '<i class="fa fa-exclamation text-red-500"></i>';
                    img.parentNode.replaceChild(errorIcon, img);
                };
                
                return img;
            }
            
            // 根据趋势文本获取对应的图片URL
            function getImageUrlByTrendText(text) {
                // 检查文本是否包含任何趋势关键词
                for (const [key, url] of Object.entries(TREND_IMAGE_MAP)) {
                    if (text.includes(key)) {
                        return url;
                    }
                }
                
                // 如果没有匹配到，使用本地默认图片
                return "sbg/default.png";
            }
            
            // 分析趋势文本，提取相关类别
            function extractCategoriesFromTrends(trendTexts) {
                const categories = new Set();
                const trendText = trendTexts.join(' ');
                
                // 检查每个类别是否出现在趋势文本中
                Object.keys(CATEGORY_ITEMS).forEach(category => {
                    if (trendText.includes(category)) {
                        categories.add(category);
                    }
                });
                
                return Array.from(categories);
            }
            
            // 根据趋势文本生成推荐列表
            function generateRecommendations(trendTexts) {
                // 1. 提取相关类别
                const categories = extractCategoriesFromTrends(trendTexts);
                
                // 2. 计算每个物品的最终数值
                const itemValues = {};
                
                // 初始化所有物品的基础数值
                Object.keys(ITEM_BASE_VALUES).forEach(item => {
                    itemValues[item] = {
                        baseValue: ITEM_BASE_VALUES[item],
                        finalValue: ITEM_BASE_VALUES[item],
                        hasBonus: false
                    };
                });
                
                // 对相关类别的物品增加20%数值
                categories.forEach(category => {
                    const items = CATEGORY_ITEMS[category] || [];
                    items.forEach(item => {
                        if (itemValues[item]) {
                            itemValues[item].finalValue = Math.round(itemValues[item].baseValue * 1.2);
                            itemValues[item].hasBonus = true;
                        }
                    });
                });
                
                // 3. 转换为数组并按最终数值降序排序
                const sortedItems = Object.keys(itemValues)
                    .map(item => ({
                        name: item,
                        ...itemValues[item]
                    }))
                    .sort((a, b) => b.finalValue - a.finalValue);
                
                // 4. 取前四名
                return sortedItems.slice(0, 4);
            }
            
            // 更新推荐区域
            function updateRecommendations(trendTexts, isCurrent, shouldEmpty = false) {
                const prefix = isCurrent ? "currentRec" : "nextRec";
                
                if (shouldEmpty) {
                    // 清空推荐区域
                    for (let i = 1; i <= 4; i++) {
                        const id = `${prefix}${i}`;
                        const placeholder = document.querySelector(`.recommend-placeholder[data-id="${id}"]`);
                        if (placeholder) {
                            placeholder.innerHTML = '<i class="fa fa-ban text-3xl text-gray-400"></i>';
                        }
                        
                        const textEl = document.querySelector(`p[data-id="${id}-text"]`);
                        if (textEl) {
                            textEl.textContent = '';
                        }
                        
                        const valueEl = document.querySelector(`span[data-id="${id}-value"]`);
                        if (valueEl) {
                            valueEl.textContent = '';
                            valueEl.classList.remove('highlight');
                        }
                    }
                    return;
                }
                
                const recommendations = generateRecommendations(trendTexts);
                
                for (let i = 0; i < 4; i++) {
                    const rec = recommendations[i];
                    if (!rec) break;
                    
                    const id = `${prefix}${i + 1}`;
                    
                    // 更新文本
                    const textEl = document.querySelector(`p[data-id="${id}-text"]`);
                    if (textEl) {
                        textEl.textContent = rec.name;
                    }
                    
                    // 更新数值和+20%标记
                    const valueEl = document.querySelector(`span[data-id="${id}-value"]`);
                    if (valueEl) {
                        if (rec.hasBonus) {
                            // 对于有加成的，使用更醒目的格式
                            valueEl.innerHTML = `${rec.finalValue}<span class="bonus">20%</span>`;
                            valueEl.classList.add('highlight');
                        } else {
                            // 对于无加成的，使用更低调的格式
                            valueEl.textContent = rec.finalValue;
                            valueEl.classList.remove('highlight');
                        }
                    }
                    
                    // 更新图片
                    const placeholder = document.querySelector(`.recommend-placeholder[data-id="${id}"]`);
                    if (placeholder && RECOMMEND_IMAGE_MAP[rec.name]) {
                        placeholder.innerHTML = '<i class="fa fa-spinner fa-spin text-3xl"></i>';
                        
                        const img = document.createElement('img');
                        img.src = RECOMMEND_IMAGE_MAP[rec.name];
                        img.className = 'w-full h-full object-cover';
                        img.alt = rec.name;
                        
                        img.onload = () => {
                            placeholder.parentNode.replaceChild(img, placeholder);
                        };
                        
                        img.onerror = () => {
                            placeholder.innerHTML = `<i class="fa fa-exclamation-triangle text-3xl text-gray-500"></i>`;
                            console.error(`图片加载失败: ${RECOMMEND_IMAGE_MAP[rec.name]}`);
                        };
                    }
                }
            }
            
            // 切换趋势：将下期趋势移动到本期，下期留空
            function switchTrends() {
                // 防止重复切换
                if (isTrendSwitched || !originalData) return;
                
                // 从原始数据中获取下期趋势
                const next1Data = originalData.trends?.next1;
                const next2Data = originalData.trends?.next2;
                
                // 验证下期趋势数据是否存在
                if (!next1Data || !next2Data || !next1Data.text || !next2Data.text) {
                    console.error("下期趋势数据不完整，无法切换");
                    return;
                }
                
                // 更新本期趋势文本
                document.querySelector('p[data-id="current1-text"]').textContent = next1Data.text;
                document.querySelector('p[data-id="current2-text"]').textContent = next2Data.text;
                
                // 更新本期趋势图片
                const current1Container = document.querySelector('[data-id="current1"]');
                const current2Container = document.querySelector('[data-id="current2"]');
                
                // 为current1设置图片
                if (current1Container) {
                    current1Container.innerHTML = '<i class="fa fa-spinner fa-spin text-2xl sm:text-3xl text-white/80"></i>';
                    const imageUrl = getImageUrlByTrendText(next1Data.text);
                    
                    const img = document.createElement('img');
                    img.src = imageUrl;
                    img.className = 'content-image';
                    img.alt = next1Data.text;
                    
                    img.onload = () => {
                        current1Container.innerHTML = '';
                        current1Container.appendChild(img);
                        // 添加热门标识
                        const cornerImg = createCornerImage('current1');
                        current1Container.closest('.image-container').appendChild(cornerImg);
                    };
                    
                    img.onerror = () => {
                        current1Container.innerHTML = '<i class="fa fa-picture-o text-2xl sm:text-3xl text-white/80"></i>';
                    };
                }
                
                // 为current2设置图片
                if (current2Container) {
                    current2Container.innerHTML = '<i class="fa fa-spinner fa-spin text-2xl sm:text-3xl text-white/80"></i>';
                    const imageUrl = getImageUrlByTrendText(next2Data.text);
                    
                    const img = document.createElement('img');
                    img.src = imageUrl;
                    img.className = 'content-image';
                    img.alt = next2Data.text;
                    
                    img.onload = () => {
                        current2Container.innerHTML = '';
                        current2Container.appendChild(img);
                        // 添加热门标识
                        const cornerImg = createCornerImage('current2');
                        current2Container.closest('.image-container').appendChild(cornerImg);
                    };
                    
                    img.onerror = () => {
                        current2Container.innerHTML = '<i class="fa fa-picture-o text-2xl sm:text-3xl text-white/80"></i>';
                    };
                }
                
                // 清空下期趋势
                const next1Container = document.querySelector('[data-id="next1"]');
                const next2Container = document.querySelector('[data-id="next2"]');
                if (next1Container) next1Container.innerHTML = '';
                if (next2Container) next2Container.innerHTML = '';
                
                document.querySelector('p[data-id="next1-text"]').textContent = '';
                document.querySelector('p[data-id="next2-text"]').textContent = '';
                
                // 更新推荐内容
                updateRecommendations([next1Data.text, next2Data.text], true);  // 本期推荐
                updateRecommendations([], false, true);  // 清空下期推荐
                
                // 更新倒计时显示
                countdownElement.innerHTML = '<i class="fa fa-clock-o mr-1"></i>已更新';
                
                // 标记为已切换
                isTrendSwitched = true;
                
                // 显示更新提示
                showUpdateIndicator();
            }
            
            // 更新页面内容
            function updatePageContent(data) {
                if (!data || typeof data !== 'object' || !data.trends) {
                    showError('数据格式错误');
                    return;
                }
                
                // 存储原始数据，用于后续可能的切换
                originalData = data;
                
                // 提取趋势文本
                const currentTrendTexts = [];
                const nextTrendTexts = [];
                
                // 处理趋势内容
                Object.keys(data.trends).forEach(id => {
                    const item = data.trends[id];
                    if (!item || typeof item !== 'object' || !item.text) {
                        const container = document.querySelector(`[data-id="${id}"]`);
                        if (container) {
                            container.innerHTML = '<i class="fa fa-exclamation-triangle text-2xl sm:text-3xl text-white/80"></i>';
                        }
                        const textEl = document.querySelector(`p[data-id="${id}-text"]`);
                        if (textEl) textEl.textContent = '数据错误';
                        return;
                    }
                    
                    const container = document.querySelector(`[data-id="${id}"]`);
                    if (!container) return;
                    
                    // 根据文本获取图片URL
                    const imageUrl = getImageUrlByTrendText(item.text);
                    
                    container.innerHTML = '<i class="fa fa-spinner fa-spin text-2xl sm:text-3xl text-white/80"></i>';
                    
                    const img = document.createElement('img');
                    img.src = imageUrl;
                    img.className = 'content-image';
                    img.alt = item.text || '图片';
                    
                    img.onload = () => {
                        container.innerHTML = '';
                        container.appendChild(img);
                        
                        if (id.startsWith('current')) {
                            // 添加固定的左上角热门图片
                            const cornerImg = createCornerImage(id);
                            container.closest('.image-container').appendChild(cornerImg);
                        }
                    };
                    
                    img.onerror = () => {
                        container.innerHTML = '<i class="fa fa-picture-o text-2xl sm:text-3xl text-white/80"></i>';
                    };
                    
                    const textEl = document.querySelector(`p[data-id="${id}-text"]`);
                    if (textEl) {
                        textEl.textContent = item.text;
                        
                        if (id.startsWith('current')) {
                            currentTrendTexts.push(item.text);
                        } else if (id.startsWith('next')) {
                            nextTrendTexts.push(item.text);
                        }
                    }
                });
                
                // 检查是否需要立即切换（如果倒计时为0）
                const seconds = calculateTimeDifference(data?.nextUpdateTime);
                if (seconds <= 0) {
                    // 使用setTimeout确保DOM已更新
                    setTimeout(switchTrends, 300);
                } else {
                    // 正常更新推荐
                    updateRecommendations(currentTrendTexts, true);  // 本期推荐
                    updateRecommendations(nextTrendTexts, false);    // 下期推荐
                }
            }
            
            // 计算倒计时
            function calculateTimeDifference(targetTimeString) {
                if (!targetTimeString) return 3600; // 默认1小时
                
                const targetTime = new Date(targetTimeString);
                const currentTime = new Date();
                const differenceMs = targetTime - currentTime;
                
                // 当倒计时不为正数时返回0
                return differenceMs > 0 ? Math.floor(differenceMs / 1000) : 0;
            }
            
            // 启动倒计时
            function startCountdown(durationSeconds) {
                if (countdownTimer) clearInterval(countdownTimer);
                
                // 确保开始时就是正确的值（不为负数）
                let seconds = Math.max(0, durationSeconds);
                
                // 如果初始就是0，立即切换
                if (seconds === 0) {
                    countdownElement.innerHTML = '<i class="fa fa-clock-o mr-1"></i>正在更新...';
                    return;
                }
                
                function updateCountdown() {
                    if (seconds <= 0) {
                        clearInterval(countdownTimer);
                        countdownElement.innerHTML = '<i class="fa fa-clock-o mr-1"></i>正在更新...';
                        switchTrends();
                        return;
                    }
                    
                    const hours = Math.floor(seconds / 3600).toString().padStart(2, '0');
                    const minutes = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
                    const secs = (seconds % 60).toString().padStart(2, '0');
                    
                    // 超窄屏幕优化显示
                    let displayText = `${hours}:${minutes}:${secs}`;
                    if (window.innerWidth < 320) {
                        displayText = `${minutes}:${secs}`;
                    }
                    
                    countdownElement.innerHTML = `<i class="fa fa-clock-o mr-1"></i>刷新：${displayText}`;
                    seconds--;
                }
                
                updateCountdown();
                countdownTimer = setInterval(updateCountdown, 1000);
            }
            
            // 获取数据 - 带重试机制
            async function fetchDataWithRetry(url, retries = 2, delay = 1000) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 8000); // 单次请求超时8秒
                    
                    const response = await fetch(`${url}?t=${new Date().getTime()}`, {
                        signal: controller.signal,
                        headers: { 'Accept': 'application/json' }
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (!response.ok) {
                        if (retries > 0) {
                            await new Promise(resolve => setTimeout(resolve, delay));
                            return fetchDataWithRetry(url, retries - 1, delay * 2);
                        }
                        throw new Error(`服务器错误: ${response.status}`);
                    }
                    
                    const text = await response.text();
                    try {
                        return JSON.parse(text);
                    } catch (e) {
                        throw new Error('数据格式错误');
                    }
                } catch (error) {
                    if (retries > 0 && error.name !== 'AbortError') {
                        await new Promise(resolve => setTimeout(resolve, delay));
                        return fetchDataWithRetry(url, retries - 1, delay * 2);
                    }
                    
                    // 更详细的错误信息
                    let errorMsg = '加载失败，请重试';
                    if (error.name === 'AbortError') {
                        errorMsg = '请求超时，请重试';
                    } else if (error.message.includes('Failed to fetch')) {
                        errorMsg = '网络连接失败，请检查网络';
                    }
                    
                    throw new Error(errorMsg);
                }
            }
            
            // 初始化流程
            async function fetchAndInit() {
                try {
                    showLoading();
                    resetToLoadingState();
                    
                    const data = await fetchDataWithRetry(API_URL);
                    updatePageContent(data);
                    
                    const seconds = calculateTimeDifference(data?.nextUpdateTime);
                    startCountdown(seconds || 0);
                } catch (error) {
                    console.error('初始化失败:', error);
                    showError(error.message || '加载失败，请重试');
                } finally {
                    hideLoading();
                }
            }
            
            // 手动刷新按钮事件
            manualRefreshBtn.addEventListener('click', () => {
                fetchAndInit();
            });
            
            // 启动应用
            fetchAndInit();
            
            // 离线检测
            window.addEventListener('offline', () => {
                showError('网络已断开，请检查连接');
            });
            
            // 在线恢复检测
            window.addEventListener('online', () => {
                showUpdateIndicator();
                updateIndicator.textContent = '网络已恢复，正在重新加载...';
                fetchAndInit();
            });
        });
    </script>
</body>
